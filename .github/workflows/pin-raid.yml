name: Refresh raid attackers

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pin-raid
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run pin:raid
      - name: Commit snapshot when the lists change
        run: |
          if git diff --quiet -- data/raid-attackers.json data/pin.json; then
            echo "raid snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raid-attackers.json data/pin.json
          git commit -m "Refresh Dittobase raid snapshot."
          git push
